; Build check for microcontrollers (used by CI, also runs locally):  pio run -d ci
; The library sources are compiled as project sources (ci/src/amis_all.cpp), so -Werror applies to them
; but not to the framework. The examples are included unchanged. Platforms are pinned so a new toolchain
; cannot change the result unnoticed (update them on purpose).

[platformio]
default_envs = esp8266, esp32, esp32s3, esp32c3, esp32c6_idf, esp32_idf

[env]
build_src_flags = -Wall -Wextra -Werror -I../src
lib_ldf_mode = off

[arduino]
framework = arduino
build_src_filter = -<*> +<amis_all.cpp>

[env:esp8266]
extends = arduino
platform = espressif8266@4.2.1
board = d1_mini
build_src_filter = ${arduino.build_src_filter} +<example_esp8266.cpp>

[env:esp32]
extends = arduino
platform = espressif32@8.0.0
board = esp32dev
build_src_filter = ${arduino.build_src_filter} +<example_esp32.cpp>

[env:esp32s3]
extends = env:esp32
board = esp32-s3-devkitc-1

[env:esp32c3]
extends = env:esp32
board = esp32-c3-devkitm-1

[idf]
framework = espidf
platform = espressif32@8.0.0

[env:esp32c6_idf]
extends = idf
board = esp32-c6-devkitc-1

[env:esp32_idf]
extends = idf
board = esp32dev
